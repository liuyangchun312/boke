server:
  port: 8080

spring:
  application:
    name: blog-backend
  profiles:
    default: dev
  datasource:
    url: ${BLOG_DB_URL:jdbc:h2:file:./data/blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${BLOG_DB_USERNAME:sa}
    password: ${BLOG_DB_PASSWORD:}
    driver-class-name: ${BLOG_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

blog:
  jwt:
    secret: ${BLOG_JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
    expiration-minutes: ${BLOG_JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.example.blog: INFO
