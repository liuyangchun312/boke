# Include this file inside nginx's http context (for example conf.d/).
# Replace certificate paths and the static root with your deployment paths.
limit_req_zone $binary_remote_addr zone=blog_login:10m rate=5r/m;
# Empty keys are not tracked, so normal GET requests remain unrestricted.
map $request_method $blog_comment_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $blog_comment_key zone=blog_comments:10m rate=3r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/taihe/frontend;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/api/auth/login(?:[;/]|$) {
        limit_req zone=blog_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reader comments are public, so keep automated spam bursts away from the application.
    location ~ ^/api/posts/[0-9]+/comments(?:[;/]|$) {
        limit_req zone=blog_comments burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Article and archive URLs must reach Vue Router on direct visits.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
